# Cloudflare Worker that sends the daily-task reminders (code in remind/). Cloudflare builds it from this repo on every push to main.
name = "khareeta"   # must match the Worker name in Cloudflare (Workers Builds)
main = "remind/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[triggers]
crons = ["0 * * * *"]

[[kv_namespaces]]
binding = "REMIND"
id = "aec7a04b8f564c04bd0acaa8a577da34"
