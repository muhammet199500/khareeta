<p class="eb">العبارة الجامعة التي يحفظها الطالب</p>
<p class="jamia">الوضوء واجب للصلاة والطواف ومسّ المصحف. وفروضه ستة: غسل الوجه، واليدين إلى المرفقين، ومسح الرأس كله، وغسل الرجلين إلى الكعبين، والترتيب، والموالاة. وينقضه: الخارج من السبيلين، وزوال العقل، ومسّ الفرج، وأكل لحم الإبل، والردة.</p>
<aside>تجمع المسائل الثماني.</aside>
