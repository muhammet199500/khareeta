<div class="head">
<p class="eb">المسألة السادسة · قواعد</p>
<h2>النوم والشك</h2>
</div>
<div class="row">
<div class="card" style="--i:0"><p class="tag">النوم</p><h3>«الْعَيْنُ وِكَاءُ السَّهِ»</h3><p class="txt">الناقض المستغرق الذي يذهب معه الإدراك؛ واليسير لا ينقض.</p></div>
<div class="card ink" style="--i:1"><p class="tag">الشك</p><h3>«حَتَّى يَسْمَعَ صَوْتًا، أَوْ يَجِدَ رِيحًا»</h3><p class="txt">اليقين لا يزول بالشك.</p></div>
</div>
<p class="note">الدم اليسير لا ينقض الوضوء <b>بالاتفاق</b>.</p>
<div class="foot"><p class="ft">الوضوء</p><div class="pn"></div></div>
<aside>الوكاء: الرباط؛ والسَّه: الدبر.</aside>
