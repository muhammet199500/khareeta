<section id="mata" class="c alt">
<div class="head">
<p class="eb">المسألة الثانية</p>
<h2>على من يجب؟ ومتى؟</h2>
</div>
<div class="row">
<div class="card" style="--i:0"><p class="tag">على من؟</p><h3>المسلم البالغ العاقل</h3><p class="txt">إذا أراد الصلاة وما في حكمها.</p></div>
<div class="card ink" style="--i:1"><p class="tag">متى؟</p><h3>إذا دخل الوقت</h3><p class="txt">أو أراد فعلًا يُشترط له الوضوء، كالطواف ومسّ المصحف.</p></div>
</div>
<p class="note">الوضوء يجب <b>لغيره</b>: فمن كان على وضوء لم يجب عليه أن يتوضأ مرة أخرى.</p>
<div class="foot"><p class="ft">الوضوء</p><div class="pn"></div></div>
<aside>ولا حرج أن يتوضأ قبل دخول الوقت.</aside>
</section>
