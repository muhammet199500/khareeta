<p class="eb">العبارة الجامعة التي يحفظها الطالب</p>
<p class="jamia">السواك سنة في كل وقت، ويتأكد عند الوضوء والصلاة والقيام من النوم ودخول البيت؛ وهو مطهرة للفم مرضاة للرب. وخصال الفطرة: الاستحداد، والختان، وقصّ الشارب، وتقليم الأظفار، ونتف الإبط، مع إعفاء اللحية.</p>
