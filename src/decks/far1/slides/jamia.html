<p class="eb">العبارة الجامعة التي يحفظها الطالب</p>
<p class="jamia">الطهارة ارتفاع الحدث وزوال الخبث، وتحصل بالماء الطهور. والأصل في الماء الطهارة، ما لم تغيّره النجاسة، أو يكن دون القلّتين فتخالطه.</p>
<aside>يُطلب من الطلاب حفظ هذه العبارة؛ فهي تجمع التعريف والقاعدة والاستثناء.</aside>
