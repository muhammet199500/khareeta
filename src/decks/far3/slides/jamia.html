<p class="eb">العبارة الجامعة التي يحفظها الطالب</p>
<p class="jamia">يجزئ الاستنجاء بالماء أو الاستجمار بثلاث مسحات بطاهر منقٍ مباح، والجمع أفضل؛ ولا تُستقبل القبلة ولا تُستدبر في الصحراء بلا حائل؛ ويُسمّي ويتعوّذ داخلًا، ويقول «غفرانك» خارجًا؛ ولا يؤذي الناس في طرقهم وظلّهم.</p>
