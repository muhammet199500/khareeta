<p class="eb">العبارة الجامعة التي يحفظها الطالب</p>
<p class="jamia">الأصل في الآنية الإباحة، إلا آنية الذهب والفضة فيحرم الأكل والشرب فيها؛ وآنية الكفار حلال حتى تُعلم نجاستها؛ وجلد الميتة يطهر بالدباغ إن كانت مما يُؤكل.</p>
<aside>يُطلب من الطلاب حفظ هذه العبارة؛ فهي تجمع المسائل الأربع.</aside>
