<div class="head">
<p class="eb">ترسيخ المعنى</p>
<h2>أسئلة المراجعة (١)</h2>
</div>
<div class="qa"><p class="qn">١</p><div class="qbody"><p class="q">ما موجبات الغسل؟</p><p class="a fragment">خروج المني، والجماع، وإسلام الكافر، وانقطاع الحيض والنفاس، والموت.</p></div></div>
<div class="qa"><p class="qn">٢</p><div class="qbody"><p class="q">ما الصفة المجزئة للغسل؟</p><p class="a fragment">تعميم البدن بالماء مع النية.</p></div></div>
<div class="qa"><p class="qn">٣</p><div class="qbody"><p class="q">هل تنقض المرأة شعرها لغسل الجنابة؟</p><p class="a fragment">لا؛ ويلزمها في غسل الحيض.</p></div></div>
<div class="foot"><p class="ft">الغسل</p><div class="pn"></div></div>
<aside>اطرح السؤال أولًا، ثم اضغط لإظهار الجواب.</aside>
